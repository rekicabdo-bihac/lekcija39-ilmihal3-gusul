a</button><button onclick="show('cards')">Kartice</button><button onclick="startQuiz()">Kviz (26)</button><button onclick="startPairs()">Spoji parove</button><button onclick="startMemory()">Memori</button><button onclick="full()">Cijeli ekran</button></nav><section id="lesson"></section><section id="cards" class="hide"><div class="card"><div id="cardCount"></div><div id="flash" class="big" onclick="flip()"></div><nav><button onclick="prevCard()">Prethodna</button><button onclick="flip()">Okreni</button><button onclick="nextCard()">Sljedeća</button></nav></div></section><section id="quiz" class="hide"><div class="card"><div id="progress"></div><h2 id="question"></h2><div id="answers"></div><p id="score"></p></div></section><section id="pairs" class="hide"><div class="card"><h2>Spoji pitanje i odgovor</h2><p>Pronađi 6 odgovarajućih parova.</p><div id="pairArea" class="pair"></div><p id="pairStatus"></p><button onclick="startPairs()">Nova postava</button></div></section><section id="memory" class="hide"><div class="card"><h2>Memori</h2><p>Pronađi 6 parova.</p><div id="memoryArea" class="memory"></div><p id="memoryStatus"></p><button onclick="startMemory()">Nova postava</button></div></section></main><footer><a href="https://rekicabdo-bihac.github.io/mektebski-portal/">Digitalni mektebski centar</a></footer><script>
const data=[{"q": "Šta je gusul?", "options": ["Vjersko kupanje radi postizanja propisane čistoće.", "Samo pranje ruku prije namaza.", "Uzimanje abdesta bez kupanja.", "Pranje odjeće prije džume."], "answer": 0}, {"q": "Koji kur’anski ajet govori o kupanju nakon džunupluka?", "options": ["El-Maide, 6.", "El-Bekare, 43.", "En-Nahl, 64.", "El-Bekare, 196."], "answer": 0}, {"q": "Šta je jedan od ciljeva gusula?", "options": ["Postizanje čistoće potrebne za određene ibadete.", "Zamjena svakog namaza.", "Zamjena ramazanskog posta.", "Oslobađanje od svih vjerskih obaveza."], "answer": 0}, {"q": "Kada je ženi obavezan gusul nakon hajza?", "options": ["Nakon završetka menstruacije.", "Prije početka menstruacije.", "Svakog dana menstruacije.", "Samo na početku ramazana."], "answer": 0}, {"q": "Kada je ženi obavezan gusul nakon nifasa?", "options": ["Nakon završetka krvarenja poslije poroda.", "Samo prije poroda.", "Nakon svakog hranjenja djeteta.", "Samo sedmog dana nakon poroda."], "answer": 0}, {"q": "Kako se naziva stanje vjerske nečistoće koje zahtijeva gusul?", "options": ["Džunupluk.", "Tejemum", "Nedzaset", "Itikaf."], "answer": 0}, {"q": "Koja radnja nije dopuštena osobi u stanju džunupluka prije gusula?", "options": ["Klanjati namaz.", "Razgovarati s porodicom.", "Jesti dozvoljenu hranu.", "Obavljati kućne poslove."], "answer": 0}, {"q": "Šta je zabranjeno džunup osobi u vezi s Kur’anom?", "options": ["Uzimati Kur’an bez omota i učiti ga.", "Slušati pouku o vjeri.", "Čitati običnu knjigu.", "Učiti školsko gradivo."], "answer": 0}, {"q": "Šta je džunup osobi zabranjeno u vezi s džamijom?", "options": ["Ulaziti u džamiju.", "Proći pored džamije.", "Gledati džamiju izvana.", "Razgovarati o džamiji."], "answer": 0}, {"q": "Šta je džunup osobi zabranjeno u vezi s Kabom?", "options": ["Činiti tavaf oko Kabe.", "Gledati fotografiju Kabe.", "Učiti o hadžu.", "Putovati prema Mekki."], "answer": 0}, {"q": "Koliko farzova ima gusul?", "options": ["Tri.", "Dva.", "Četiri.", "Pet."], "answer": 0}, {"q": "Koji je prvi farz gusula?", "options": ["Gargara.", "Oprati samo dlanove.", "Istinšak.", "Oprati samo stopala."], "answer": 0}, {"q": "Kako se naziva ispiranje usta i grla pri gusulu?", "options": ["Gargara.", "Istinšak.", "Mesh.", "Telbija."], "answer": 0}, {"q": "Koji je drugi farz gusula?", "options": ["Isprati nos vodom.", "Oprati samo uši.", "Oprati samo šake.", "Potrati potiljak."], "answer": 0}, {"q": "Kako se naziva ispiranje nosa pri gusulu?", "options": ["Istinšak.", "Gargara.", "Tavaf.", "Sa’j."], "answer": 0}, {"q": "Koji je treći farz gusula?", "options": ["Oprati cijelo tijelo tako da nigdje ne ostane suho.", "Oprati samo lice i ruke.", "Potrati samo glavu.", "Oprati samo noge."], "answer": 0}, {"q": "Šta znači izraz „gasli vudžud“ ?", "options": ["Pranje cijelog tijela.", "Ispiranje samo nosa.", "Pranje samo ruku.", "Učenje nijjeta naglas."], "answer": 0}, {"q": "Šta je sunnet proučiti prije kupanja?", "options": ["Bismillu i donijeti nijjet.", "Tekbire tešrika.", "Telbijju.", "Ezan i ikamet."], "answer": 0}, {"q": "Koja je radnja navedena među sunnetima gusula?", "options": ["Uzeti abdest.", "Obaviti tavaf.", "Bacati kamenčiće.", "Klanjati bajram-namaz."], "answer": 0}, {"q": "Odakle je sunnet započeti kupanje tijela?", "options": ["Od glave, zatim preko desnog i lijevog ramena.", "Od lijevog stopala prema glavi.", "Samo od desne šake.", "Od leđa, bez pranja glave."], "answer": 0}, {"q": "Kako se prema lekciji pri gusulu pere tijelo?", "options": ["Da se zatim opere cijelo tijelo.", "Da se opere samo gornji dio.", "Da se opere samo desna strana.", "Da se opere samo lice."], "answer": 0}, {"q": "Šta je navedeno kao sunnet u vezi s ponavljanjem kupanja?", "options": ["Ponoviti kupanje više puta.", "Kupanje ponoviti samo jednom godišnje.", "Kupanje ponoviti tek nakon Bajrama.", "Ne ponavljati pranje nijednog dijela."], "answer": 0}, {"q": "Šta se može koristiti tokom gusula?", "options": ["Šampon, sapun i razni mirisi.", "Samo suhi peškir bez vode.", "Samo pijesak umjesto vode.", "Samo parfem bez pranja."], "answer": 0}, {"q": "Kada je sunnet okupati ?", "options": ["Prije džuma-namaza.", "Prije svakog akšam-namaza.", "Samo prije vitr-namaza.", "Samo nakon teravije."], "answer": 0}, {"q": "Kada je sunnet okupati ?", "options": ["Prije bajram-namaza.", "Sedam dana nakon Bajrama.", "Samo poslije bajramskog ručka.", "Samo nakon ikindije na Bajram."], "answer": 0}, {"q": "Kada je sunnet okupati se u vezi s hadžom?", "options": ["Neposredno pred oblačenje ihrama.", "Tek nakon povratka kući.", "Samo nakon oproštajnog tavafa.", "Tek nakon izlaska iz Mekke."], "answer": 0}] , sections=[["Gusul – vjersko kupanje", "Gusul je Kur’anom propisano vjersko kupanje radi čistoće i obavljanja namaza i učenja Kur’ana. U suri El-Maide, 6. ajet, naređeno je kupanje osobi u stanju džunupluka."], ["Kada je gusul obavezan", "Gusul je obavezan muškarcu i ženi nakon spolnog odnosa; nakon izlijevanja sjemene tekućine u snu ili na javi uz nadražaj; te ženi nakon završetka hajza (menstruacije) i nifasa (krvarenja poslije poroda)."], ["Šta ne može činiti osoba u stanju džunupluka", "Dok se ne okupa, osoba ne može klanjati namaz, uzimati Kur’an bez omota ili ga učiti, ulaziti u džamiju niti činiti tavaf oko Kabe."], ["Tri farza gusula", "1. Isprati usta i grlo vodom – gargara.\n2. Isprati nos vodom – istinšak.\n3. Oprati cijelo tijelo da nigdje ne ostane suho – gasli vudžud."], ["Sunneti gusula", "Prije kupanja proučiti Bismillu i donijeti nijjet; uzeti abdest; početi kupanje od glave preko desnog i lijevog ramena i oprati cijelo tijelo; ponoviti kupanje više puta; koristiti šampon, sapun i mirise."], ["Kada je kupanje sunnet", "Sunnet je okupati se prije džuma-namaza, prije bajram-namaza i neposredno pred oblačenje ihrama."], ["Hadis o gusulu", "Mejmuna, r.a., prenosi kako je Poslanik, a.s., prao šake, očistio stidno mjesto, uzeo abdest, polio glavu i cijelo tijelo, zatim oprao noge; ponuđeni peškir nije prihvatio. (Muslim)"], ["Nijjet za gusul", "NEVEJTUL-GUSLE LIREF’IL-DŽENABETI VE LIREF’IL-HADESI TEKARRUBEN ILALLAHI TE’ALA."]];
const $=id=>document.getElementById(id);let card=0,turned=false,qi=0,points=0,lock=false,pick=null,matched=0,memFirst=null,memLock=false,memMatched=0;
function beep(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?740:240;o.connect(g);g.connect(a.destination);g.gain.value=.06;o.start();o.stop(a.currentTime+.13)}catch(e){}}
function full(){document.documentElement.requestFullscreen?.().catch(()=>{})}
function show(id){for(let s of document.querySelectorAll('main section'))s.classList.toggle('hide',s.id!==id);window.scrollTo(0,0);if(id==='cards')renderCard()}
$('lesson').innerHTML=sections.map(([h,t])=>`<article class="card"><h2>${h}</h2><p>${t}</p></article>`).join('');
function renderCard(){$('cardCount').textContent=`Kartica ${card+1} / ${data.length}`;$('flash').textContent=turned?data[card].options[data[card].answer]:data[card].q}function flip(){turned=!turned;renderCard()}function nextCard(){card=(card+1)%data.length;turned=false;renderCard()}function prevCard(){card=(card+data.length-1)%data.length;turned=false;renderCard()}
function startQuiz(){qi=0;points=0;show('quiz');renderQuiz()}function renderQuiz(){lock=false;if(qi===data.length){$('progress').textContent='Kviz završen';$('question').textContent=`Rezultat: ${points} bodova`;$('answers').innerHTML='<button onclick="startQuiz()">Ponovi kviz</button>';$('score').textContent='';return}let d=data[qi];$('progress').textContent=`Pitanje ${qi+1} / ${data.length}`;$('question').textContent=d.q;$('score').textContent=`Bodovi: ${points}`;let order=[0,1,2,3].sort(()=>Math.random()-.5);$('answers').innerHTML='';order.forEach(i=>{let b=document.createElement('button');b.className='option';b.textContent=d.options[i];b.onclick=()=>{if(lock)return;lock=true;let ok=i===d.answer;points+=ok?10:-3;beep(ok);b.classList.add(ok?'good':'bad');[...$('answers').children].forEach(x=>x.disabled=true);setTimeout(()=>{qi++;renderQuiz()},850)};$('answers').appendChild(b)})}
function sample(){return [...data.keys()].sort(()=>Math.random()-.5).slice(0,6)}
function startPairs(){show('pairs');matched=0;pick=null;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[data[i].answer]}]).sort(()=>Math.random()-.5);$('pairArea').innerHTML='';$('pairStatus').textContent='Spojeno: 0 / 6';items.forEach(it=>{let b=document.createElement('button');b.className='tile';b.textContent=it.txt;b.onclick=()=>{if(b.classList.contains('done'))return;if(!pick){pick={it,b};b.classList.add('sel');return}if(pick.b===b){b.classList.remove('sel');pick=null;return}if(pick.it.i===it.i&&pick.it.kind!==it.kind){b.classList.add('done');pick.b.classList.remove('sel');pick.b.classList.add('done');matched++;beep(true);$('pairStatus').textContent=`Spojeno: ${matched} / 6${matched===6?' – Bravo!':''}`}else{pick.b.classList.remove('sel');beep(false)}pick=null};$('pairArea').appendChild(b)})}
function startMemory(){show('memory');memFirst=null;memLock=false;memMatched=0;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[data[i].answer]}]).sort(()=>Math.random()-.5);$('memoryArea').innerHTML='';$('memoryStatus').textContent='Parovi: 0 / 6';items.forEach((it,j)=>{let b=document.createElement('button');b.textContent=j+1;b.onclick=()=>{if(memLock||b.classList.contains('done')||b.classList.contains('open'))return;b.classList.add('open');b.textContent=it.txt;if(!memFirst){memFirst={it,b,j};return}let prev=memFirst;memFirst=null;if(prev.it.i===it.i&&prev.it.kind!==it.kind){b.classList.add('done');prev.b.classList.add('done');memMatched++;beep(true);$('memoryStatus').textContent=`Parovi: ${memMatched} / 6${memMatched===6?' – Bravo!':''}`}else{memLock=true;beep(false);setTimeout(()=>{b.classList.remove('open');prev.b.classList.remove('open');b.textContent=j+1;prev.b.textContent=prev.j+1;memLock=false},1100)}};$('memoryArea').appendChild(b)})}
show('lesson');
</script></body></html>
